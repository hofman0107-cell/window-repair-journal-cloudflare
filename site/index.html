<style>
:root {
  --navy: #203c57;
  --gold: #d5b27c;
  --paper: #f5f3ef;
  --ink: #24364a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.8 Arial, sans-serif;
}
header, footer {
  background: var(--navy);
  color: white;
}
.nav {
  max-width: 1040px;
  margin: auto;
  padding: 22px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}
.nav a { color: white; text-decoration: none; }
.brand { font-size: 20px; font-weight: 700; }
nav a { margin-left: 20px; }
.hero {
  background: var(--navy);
  color: white;
  padding: 75px 24px;
}
.hero-inner { max-width: 1040px; margin: auto; }
.eyebrow {
  color: var(--gold);
  font-weight: bold;
  letter-spacing: 2px;
  font-size: 12px;
}
.hero h1 {
  font-size: clamp(32px, 5vw, 48px);
  line-height: 1.2;
  max-width: 700px;
}
.container {
  max-width: 1040px;
  margin: 45px auto;
  padding: 0 24px;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 24px;
}
.card, .article {
  background: white;
  border: 1px solid #e8e2d9;
  border-radius: 12px;
  padding: 28px;
}
.card::before {
  content: "";
  display: block;
  width: 40px;
  height: 3px;
  background: var(--gold);
  margin-bottom: 20px;
}
.card h2 { font-size: 21px; line-height: 1.4; }
.card a, .article a { color: var(--navy); }
.card p { color: #63758a; }
time { color: #66788a; font-size: 14px; }
.article { max-width: 850px; margin: 45px auto; }
.article h1 { font-size: clamp(28px, 4vw, 40px); }
.article img { max-width: 100%; height: auto; }
.article-content { overflow-wrap: anywhere; }
.article-content h2, .article-content h3 {
  margin-top: 30px;
}
.article-content blockquote {
  border-left: 4px solid var(--gold);
  padding: 10px 20px;
  background: var(--paper);
}
.article-content table {
  display: block;
  overflow-x: auto;
  border-collapse: collapse;
}
.article-content td, .article-content th {
  border: 1px solid #ddd;
  padding: 10px;
}
.article-content pre { overflow-x: auto; }
footer { text-align: center; padding: 25px; }
@media(max-width:600px) {
  .nav { flex-direction: column; }
  nav a { margin: 0 10px; }
  .hero { padding: 45px 24px; }
  .article { margin: 15px; padding: 22px; }
}
</style>
</head>
<body>
<header>
<div class="nav">
<a class="brand" href="https://window-repair-journal-cloudflare.pages.dev/">Window Repair Journal</a>
<nav>

<a href="https://window-repair-journal-cloudflare.pages.dev/#articles">Articles</a>
</nav>
</div>
</header>

<section class="hero">
<div class="hero-inner">
<p class="eyebrow">WINDOW CARE &amp; MAINTENANCE</p>
<h1>Practical Window Care &amp; Repair Guides</h1>
<p>Clear, useful articles on window repair,
glass maintenance, and everyday home comfort.</p>
</div>
</section>
<main class="container" id="articles">
<h2>Latest Articles</h2>

<p>No articles published yet.</p>
</div>
</main>

<footer>

</footer>
</body>
</html>
